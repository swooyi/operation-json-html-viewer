  <script>
    const STORAGE = { navWidth:'allQuestionHtmlViewer.navWidth', columns:'allImages.columns', imageSize:'allImages.imageSize', showInfo:'allImages.showInfo', selectedFile:'allImages.selectedFile', contentScrollTop:'allImages.contentScrollTop', bookmarks:'allImages.bookmarks', questionBookmarks:'questionViewer.bookmarks', questionImageSize:'allImages.questionImageSize' };
    const DB_NAME='all-question-html-viewer', DB_STORE='handles', FOLDER_HANDLE_KEY='recent-folder';
    const folderButton=document.querySelector('#folder-button'), folderInput=document.querySelector('#folder-input'), reloadButton=document.querySelector('#reload-button'), status=document.querySelector('#status'), count=document.querySelector('#count'), search=document.querySelector('#search'), fileList=document.querySelector('#file-list'), fileCount=document.querySelector('#file-count'), title=document.querySelector('#title'), imageCount=document.querySelector('#image-count'), grid=document.querySelector('#grid'), empty=document.querySelector('#empty'), imageSize=document.querySelector('#image-size'), showInfo=document.querySelector('#show-info'), bookmarkedOnly=document.querySelector('#bookmarked-only'), detail=document.querySelector('#detail'), detailName=document.querySelector('#detail-name'), detailBody=document.querySelector('#detail-body'), detailPosition=document.querySelector('#detail-position'), questionDetail=document.querySelector('#question-detail'), questionDetailName=document.querySelector('#question-detail-name'), questionDetailBody=document.querySelector('#question-detail-body'), questionDetailPosition=document.querySelector('#question-detail-position'), questionBookmark=document.querySelector('#question-bookmark'), openQuestionViewer=document.querySelector('#open-question-viewer'), questionImageSize=document.querySelector('#question-image-size'), questionImageSizeValue=document.querySelector('#question-image-size-value');
    const content=document.querySelector('article');
    let filesByName=new Map(), imageIndex=new Map(), imageUrls=[], selectedFile='', inventory=[], activeDetail=-1, activeQuestionImage=-1, activeQuestionConnection=-1, questionMathToken=0, folderHandle=null;
    const collator=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});
    function bookmarkKey(entry) { return `${selectedFile}::${entry.fileName}`; }
    function bookmarkIcon() { const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.classList.add('bookmark-icon'); svg.setAttribute('viewBox','0 0 16 16'); svg.setAttribute('aria-hidden','true'); const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d','M5 1.5A1.5 1.5 0 0 0 3.5 3v11l4.5-2.8 4.5 2.8V3A1.5 1.5 0 0 0 11 1.5H5Z'); svg.appendChild(path); return svg; }
    function readBookmarks() { try { const saved=JSON.parse(localStorage.getItem(STORAGE.bookmarks)||'[]'); return new Set(Array.isArray(saved)?saved:[]); } catch { return new Set(); } }
    function isBookmarked(entry) { return readBookmarks().has(bookmarkKey(entry)); }
    function toggleBookmark(entry) { const bookmarks=readBookmarks(), key=bookmarkKey(entry); bookmarks.has(key)?bookmarks.delete(key):bookmarks.add(key); localStorage.setItem(STORAGE.bookmarks,JSON.stringify([...bookmarks])); renderInventory(); }
    function questionBookmarkKey(connection) { return `${connection.json}::${String(connection.qNumber||'-')}번`; }
    function readQuestionBookmarks() { try { const saved=JSON.parse(localStorage.getItem(STORAGE.questionBookmarks)||'[]'); return new Set(Array.isArray(saved)?saved:[]); } catch { return new Set(); } }
    function isQuestionBookmarked(connection) { return readQuestionBookmarks().has(questionBookmarkKey(connection)); }
    function toggleQuestionBookmark(connection) { const bookmarks=readQuestionBookmarks(), key=questionBookmarkKey(connection); bookmarks.has(key)?bookmarks.delete(key):bookmarks.add(key); localStorage.setItem(STORAGE.questionBookmarks,JSON.stringify([...bookmarks])); renderInventory(); renderQuestionDetail(); }
    function imageKeys(value) { const raw=String(value||'').trim().replace(/^['"]|['"]$/g,'').replace(/\\/g,'/'); const base=raw.split('/').pop()||''; return [...new Set([raw,base].map(v=>v.normalize('NFC').toLowerCase()).filter(Boolean))]; }
    function isImage(file) { return /^image\/(png|jpe?g|webp|gif)$/i.test(file.type)||/\.(png|jpe?g|webp|gif)$/i.test(file.name); }
    function imageName(value) { const text=String(value||'').trim(); const tagged=/\[img\s*:\s*([^\]]+)\]/i.exec(text); return (tagged?tagged[1]:text).trim().replace(/^['"]|['"]$/g,'').split(/[\\/]/).pop(); }
    function values(value, result=[]) { if (typeof value==='string') { for (const match of value.matchAll(/\[img\s*:\s*([^\]]+)\]/gi)) { if (match[1].trim()) result.push(match[1].trim()); } } else if (Array.isArray(value)) value.forEach(item=>values(item,result)); else if (value&&typeof value==='object') Object.values(value).forEach(item=>values(item,result)); return result; }
    function imageValues(item, area) { const source=area==='문제' ? String(item.question?.stem||'') : String(item.explanation||''); const refs=values(source); const sequential=Array.isArray(item.images)?item.images.map(imageName).filter(Boolean):[]; let cursor=area==='해설' ? String(item.question?.stem||'').match(/\[img\]/gi)?.length||0 : 0; for (const match of source.matchAll(/\[img\]/gi)) { if (sequential[cursor]) refs.push(sequential[cursor]); cursor+=1; } return refs; }
    function noteFor(item, file) { return (Array.isArray(item.image_edit_notes)?item.image_edit_notes:[]).filter(note=>imageKeys(note?.image).some(key=>imageKeys(file).includes(key))).map(note=>String(note.note||'').trim()).filter(Boolean); }
    function sectionReference(section, sectionIndex) { const title=String(section?.section_title||''); const match=/^\s*(\d+)/.exec(title); return `section ${match?.[1]||sectionIndex+1}`; }
    function connectionOrder(connection) { const q=Number(connection.qNumber); return [connection.sectionIndex,Number.isFinite(q)?q:Number.MAX_SAFE_INTEGER,connection.area==='문제'?0:1]; }
    function compareConnections(a,b) { const first=connectionOrder(a), second=connectionOrder(b); return first[0]-second[0]||first[1]-second[1]||first[2]-second[2]; }
    function buildInventory(fileName, payload) { const map=new Map(); (payload.sections||[]).forEach((section,sectionIndex)=>{ (section?.items||[]).forEach(item=>{ ['문제','해설'].forEach(area=>{ imageValues(item,area).forEach(file=>{ const name=imageName(file); if (!name) return; const key=imageKeys(name)[0]; if (!map.has(key)) map.set(key,{fileName:name,connections:[],notes:[]}); const entry=map.get(key); const connection={ json:fileName, section:sectionReference(section,sectionIndex), sectionIndex, qNumber:item.q_number??'-', area, item }; if(!entry.connections.some(existing=>existing.json===connection.json&&existing.section===connection.section&&String(existing.qNumber)===String(connection.qNumber)&&existing.area===connection.area)) entry.connections.push(connection); entry.notes.push(...noteFor(item,name)); }); }); }); }); return [...map.values()].map(entry=>({ ...entry, connections:entry.connections.sort(compareConnections), notes:[...new Set(entry.notes)], url:imageKeys(entry.fileName).map(key=>imageIndex.get(key)).find(Boolean)||'' })).sort((a,b)=>compareConnections(a.connections[0],b.connections[0])||collator.compare(a.fileName,b.fileName)); }
    function renderFiles() { const query=search.value.trim().toLowerCase(); const names=[...filesByName.keys()].filter(name=>name.toLowerCase().includes(query)).sort(collator.compare); fileList.replaceChildren(); fileCount.textContent=`${names.length}개 파일`; if (!names.length) { fileList.textContent='표시할 JSON 파일이 없습니다.'; return; } names.forEach(name=>{ const button=document.createElement('button'); button.type='button'; button.className=`file-button${name===selectedFile?' active':''}`; button.textContent=name; button.addEventListener('click',()=>selectFile(name)); fileList.appendChild(button); }); }
    function selectFile(name, restorePosition=false) { selectedFile=name; localStorage.setItem(STORAGE.selectedFile,name); inventory=buildInventory(name,filesByName.get(name)); activeDetail=-1; title.textContent=name; if(!restorePosition) { content.scrollTop=0; localStorage.setItem(STORAGE.contentScrollTop,'0'); } renderFiles(); renderInventory(); if(restorePosition) requestAnimationFrame(()=>{ content.scrollTop=Number(localStorage.getItem(STORAGE.contentScrollTop))||0; }); }
    function renderInventory() { const visible=bookmarkedOnly.checked?inventory.filter(isBookmarked):inventory; grid.replaceChildren(); imageCount.textContent=selectedFile?`그림 ${visible.length}개${bookmarkedOnly.checked?' (북마크)':''}`:''; empty.hidden=Boolean(selectedFile&&visible.length); if (!selectedFile) { empty.textContent='왼쪽에서 JSON 파일을 선택해 주세요.'; return; } if (!inventory.length) { empty.textContent='이 JSON 파일에 연결된 그림이 없습니다.'; return; } if (!visible.length) { empty.textContent='북마크한 그림이 없습니다.'; return; } visible.forEach(entry=>{ const index=inventory.indexOf(entry); const card=document.createElement('section'); card.className='image-card'; const button=document.createElement('button'); button.className='image-button'; button.type='button'; button.title='이미지 노트 보기'; button.addEventListener('click',()=>openDetail(index)); if (entry.url) { const img=document.createElement('img'); img.src=entry.url; img.alt=entry.fileName; img.addEventListener('error',()=>{ button.replaceChildren(); const missing=document.createElement('div'); missing.className='missing'; missing.textContent=`이미지를 불러오지 못했습니다: ${entry.fileName}`; button.appendChild(missing); }); button.appendChild(img); } else { const missing=document.createElement('div'); missing.className='missing'; missing.textContent=`이미지 파일 없음: ${entry.fileName}`; button.appendChild(missing); } const actions=document.createElement('div'); actions.className='card-actions'; const bookmark=document.createElement('button'); bookmark.className=`bookmark-button${isBookmarked(entry)?' active':''}`; bookmark.type='button'; bookmark.replaceChildren(bookmarkIcon()); bookmark.title='bookmark'; bookmark.setAttribute('aria-label','bookmark'); bookmark.setAttribute('aria-pressed',String(isBookmarked(entry))); bookmark.addEventListener('click',()=>toggleBookmark(entry)); actions.appendChild(bookmark); card.append(button,actions,makeInfo(entry)); grid.appendChild(card); }); }
    function makeInfo(entry) { const info=document.createElement('div'); info.className='info'; info.hidden=!showInfo.checked; const name=document.createElement('div'); name.className='file-name'; name.textContent=entry.fileName; info.appendChild(name); const connections=document.createElement('div'); connections.className='connections'; entry.connections.forEach((connection,connectionIndex)=>{ const row=document.createElement('div'); row.className='connection'; const text=document.createElement('span'); text.textContent=`${connection.section}_${connection.qNumber}번_${connection.area}`; const jump=document.createElement('button'); jump.className='question-link'; jump.type='button'; jump.textContent='문항 보기'; jump.addEventListener('click',()=>openQuestionDetail(inventory.indexOf(entry),connectionIndex)); row.append(text,jump); if(isQuestionBookmarked(connection)) { const marker=bookmarkIcon(); marker.classList.add('connection-bookmark'); marker.setAttribute('aria-label','bookmark됨'); row.appendChild(marker); } connections.appendChild(row); }); info.appendChild(connections); return info; }
    function openDetail(index) { activeDetail=index; const entry=inventory[index]; if (!entry) return; detailName.textContent=entry.fileName; detailBody.replaceChildren(); if (entry.url) { const img=document.createElement('img'); img.src=entry.url; img.alt=entry.fileName; detailBody.appendChild(img); } else { const missing=document.createElement('div'); missing.className='missing'; missing.textContent=`이미지 파일 없음: ${entry.fileName}`; detailBody.appendChild(missing); } if (entry.notes.length) { const note=document.createElement('div'); note.className='note'; note.textContent=`이미지 노트\n${entry.notes.join('\n')}`; detailBody.appendChild(note); } const connections=makeInfo(entry); connections.hidden=false; detailBody.appendChild(connections); detailPosition.textContent=`${index+1} / ${inventory.length}`; if (!detail.open) detail.showModal(); }
    function displayValue(value) { if(value===undefined||value===null||value==='') return '-'; return typeof value==='string'?value:JSON.stringify(value,null,2); }
    function appendQuestionText(parent,value) { const text=displayValue(value); const pattern=/\[img\s*:\s*([^\]]+)\]/gi; let cursor=0, matched=false; for(const match of text.matchAll(pattern)) { matched=true; if(match.index>cursor) parent.appendChild(document.createTextNode(text.slice(cursor,match.index))); const imageFile=match[1].trim(), imageUrl=imageKeys(imageFile).map(key=>imageIndex.get(key)).find(Boolean); if(imageUrl) { const image=document.createElement('img'); image.className='question-detail-image'; image.src=imageUrl; image.alt=imageFile; parent.appendChild(image); } else { const missing=document.createElement('span'); missing.className='question-missing-image'; missing.textContent=`이미지 없음: ${imageFile}`; parent.appendChild(missing); } cursor=match.index+match[0].length; } if(!matched) parent.textContent=text; else if(cursor<text.length) parent.appendChild(document.createTextNode(text.slice(cursor))); }
    function addQuestionDetailSection(label,value,className='question-detail-text') { const section=document.createElement('section'); section.className='question-detail-section'; const heading=document.createElement('h2'); heading.textContent=label; const body=document.createElement('div'); body.className=className; appendQuestionText(body,value); section.append(heading,body); questionDetailBody.appendChild(section); }
    function addQuestionBlocks(blocks) { if(!Array.isArray(blocks)||!blocks.length) return; const section=document.createElement('section'); section.className='question-detail-section'; const heading=document.createElement('h2'); heading.textContent='blocks'; const list=document.createElement('div'); list.className='question-detail-blocks'; blocks.forEach(block=>{ const body=document.createElement('div'); body.className='question-detail-block'; if(Array.isArray(block?.lines)) block.lines.forEach((line,index)=>{ if(index) body.appendChild(document.createElement('br')); appendQuestionText(body,line); }); else appendQuestionText(body,block&&typeof block==='object'?(block.value??block.text??block.content??block):block); list.appendChild(body); }); section.append(heading,list); questionDetailBody.appendChild(section); }
    function addQuestionChoices(choices) { if(!Array.isArray(choices)) { addQuestionDetailSection('choices',choices); return; } const section=document.createElement('section'); section.className='question-detail-section'; const heading=document.createElement('h2'); heading.textContent='choices'; const list=document.createElement('ol'); list.className='question-detail-choices'; const markers=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩']; choices.forEach((choice,index)=>{ const item=document.createElement('li'), marker=document.createElement('span'), body=document.createElement('div'); marker.className='question-choice-marker'; marker.textContent=markers[index]||`${index+1}.`; appendQuestionText(body,choice); item.append(marker,body); list.appendChild(item); }); section.append(heading,list); questionDetailBody.appendChild(section); }
    function typesetQuestionMath() { const token=++questionMathToken; if(!window.MathJax) return; const typeset=()=>{ if(token!==questionMathToken||typeof window.MathJax.typesetPromise!=='function') return; window.MathJax.typesetClear?.([questionDetailBody]); window.MathJax.typesetPromise([questionDetailBody]).catch(()=>{}); }; if(window.MathJax.startup?.promise) window.MathJax.startup.promise.then(typeset).catch(()=>{}); else typeset(); }
    function currentQuestionConnection() { return inventory[activeQuestionImage]?.connections[activeQuestionConnection]||null; }
    function renderQuestionDetail() { const entry=inventory[activeQuestionImage], connection=currentQuestionConnection(); if(!entry||!connection) return; const item=connection.item||{}, question=item.question||{}; questionDetailName.textContent=`${connection.json} · ${connection.section} · ${connection.qNumber}번`; questionDetailBody.replaceChildren(); addQuestionDetailSection('문제',question.stem); addQuestionBlocks(question.blocks); addQuestionChoices(item.choices); addQuestionDetailSection('answer_type',item.answer_type,'question-detail-text question-detail-answer'); addQuestionDetailSection('answer',item.answer,'question-detail-text question-detail-answer'); addQuestionDetailSection('해설',item.explanation); questionBookmark.replaceChildren(bookmarkIcon()); questionBookmark.classList.toggle('active',isQuestionBookmarked(connection)); questionBookmark.setAttribute('aria-pressed',String(isQuestionBookmarked(connection))); questionDetailPosition.textContent=`그림 ${activeQuestionImage+1}/${inventory.length} · 연결 ${activeQuestionConnection+1}/${entry.connections.length}`; typesetQuestionMath(); }
    function openQuestionDetail(imageIndex,connectionIndex) { const entry=inventory[imageIndex]; if(!entry?.connections.length) return; activeQuestionImage=imageIndex; activeQuestionConnection=Math.min(Math.max(0,connectionIndex),entry.connections.length-1); renderQuestionDetail(); if(!questionDetail.open) questionDetail.showModal(); }
    function moveQuestionConnection(delta) { const entry=inventory[activeQuestionImage]; if(!entry?.connections.length) return; openQuestionDetail(activeQuestionImage,(activeQuestionConnection+delta+entry.connections.length)%entry.connections.length); }
    function moveQuestionImage(delta) { if(!inventory.length) return; const imageIndex=(activeQuestionImage+delta+inventory.length)%inventory.length; const connections=inventory[imageIndex].connections; openQuestionDetail(imageIndex,Math.min(activeQuestionConnection,connections.length-1)); }
    function goQuestion(connection) { const params=new URLSearchParams({autoload:'1',file:connection.json,q:String(connection.qNumber)}); window.location.href=`question-viewer.html?${params}`; }
    function setColumns(value, save=true) { const columns=[2,3,4].includes(Number(value))?Number(value):3; document.documentElement.style.setProperty('--columns',columns); document.querySelectorAll('.columns').forEach(button=>button.classList.toggle('active',Number(button.dataset.columns)===columns)); if(save)localStorage.setItem(STORAGE.columns,String(columns)); }
    function setImageSize(value, save=true) { const size=Math.min(520,Math.max(140,Number(value)||260)); imageSize.value=size; document.documentElement.style.setProperty('--image-size',`${size}px`); if(save)localStorage.setItem(STORAGE.imageSize,String(size)); }
    function setQuestionImageSize(value, save=true) { const size=Math.min(420,Math.max(140,Number(value)||220)); questionImageSize.value=size; questionImageSizeValue.textContent=`${size}px`; document.documentElement.style.setProperty('--question-image-size',`${size}px`); if(save)localStorage.setItem(STORAGE.questionImageSize,String(size)); }
    function setInfo(value, save=true) { showInfo.checked=Boolean(value); document.querySelectorAll('.info').forEach(info=>info.hidden=!showInfo.checked); if(save)localStorage.setItem(STORAGE.showInfo,showInfo.checked?'1':'0'); }
    function clearImages() { imageUrls.forEach(URL.revokeObjectURL); imageUrls=[]; imageIndex=new Map(); }
    function buildImageIndex(files) { clearImages(); files.filter(isImage).forEach(file=>{ const url=URL.createObjectURL(file); imageUrls.push(url); imageKeys(file.viewerRelativePath||file.webkitRelativePath||file.name).forEach(key=>{if(!imageIndex.has(key))imageIndex.set(key,url);}); }); }
    async function readHandle(handle,prefix='') { const result=[]; for await (const entry of handle.values()) { if(entry.kind==='file') { const file=await entry.getFile(); Object.defineProperty(file,'viewerRelativePath',{value:`${prefix}${entry.name}`,configurable:true}); result.push(file); } else if(entry.kind==='directory') result.push(...await readHandle(entry,`${prefix}${entry.name}/`)); } return result; }
    function openDb() { return new Promise((resolve,reject)=>{ const request=indexedDB.open(DB_NAME,1); request.onupgradeneeded=()=>request.result.createObjectStore(DB_STORE); request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error); }); }
    async function getHandle() { const db=await openDb(); return new Promise((resolve,reject)=>{ const request=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(FOLDER_HANDLE_KEY); request.onsuccess=()=>resolve(request.result||null); request.onerror=()=>reject(request.error); }); }
    async function saveHandle(handle) { const db=await openDb(); return new Promise((resolve,reject)=>{ const transaction=db.transaction(DB_STORE,'readwrite'); transaction.objectStore(DB_STORE).put(handle,FOLDER_HANDLE_KEY); transaction.oncomplete=resolve; transaction.onerror=()=>reject(transaction.error); }); }
    async function loadFiles(files, folderName='폴더') { buildImageIndex(files); filesByName=new Map(); for (const file of files.filter(file=>/\.json$/i.test(file.name)).sort((a,b)=>collator.compare(a.name,b.name))) { try { const payload=JSON.parse(await file.text()); if(Array.isArray(payload.sections)) filesByName.set(file.name,payload); } catch { /* Invalid JSON stays out of the picture inventory. */ } } const savedFile=localStorage.getItem(STORAGE.selectedFile); selectedFile=filesByName.has(savedFile)?savedFile:[...filesByName.keys()][0]||''; inventory=selectedFile?buildInventory(selectedFile,filesByName.get(selectedFile)):[]; count.textContent=`파일 ${filesByName.size}개 / 이미지 ${imageIndex.size}개`; status.textContent=`${folderName} 폴더를 읽었습니다.`; status.classList.remove('error'); reloadButton.disabled=!folderHandle; renderFiles(); renderInventory(); requestAnimationFrame(()=>{ content.scrollTop=Number(localStorage.getItem(STORAGE.contentScrollTop))||0; }); }
    async function loadHandle(handle) { const permission=await handle.requestPermission({mode:'read'}); if(permission!=='granted') throw new Error('폴더 읽기 권한이 필요합니다.'); folderHandle=handle; await loadFiles(await readHandle(handle),handle.name); }
    folderButton.addEventListener('click',async()=>{ try { if(window.showDirectoryPicker) { const handle=await window.showDirectoryPicker(); await saveHandle(handle); await loadHandle(handle); } else folderInput.click(); } catch(error) { if(error?.name!=='AbortError') { status.textContent=`폴더를 읽지 못했습니다: ${error.message}`; status.classList.add('error'); } } });
    async function reloadFolder() { if(!folderHandle)return; try { await loadHandle(folderHandle); } catch(error) { status.textContent=`다시 읽지 못했습니다: ${error.message}`; status.classList.add('error'); } }
    folderInput.addEventListener('change',()=>{ folderHandle=null; loadFiles([...folderInput.files],folderInput.files[0]?.webkitRelativePath?.split('/')[0]||'폴더'); }); reloadButton.addEventListener('click',reloadFolder);
    document.querySelectorAll('.columns').forEach(button=>button.addEventListener('click',()=>setColumns(button.dataset.columns))); imageSize.addEventListener('input',()=>setImageSize(imageSize.value)); questionImageSize.addEventListener('input',()=>setQuestionImageSize(questionImageSize.value)); showInfo.addEventListener('change',()=>setInfo(showInfo.checked)); bookmarkedOnly.addEventListener('change',renderInventory); search.addEventListener('input',renderFiles); content.addEventListener('scroll',()=>localStorage.setItem(STORAGE.contentScrollTop,String(content.scrollTop)));
    document.querySelector('#page-menu-button').addEventListener('click',event=>{ event.stopPropagation(); const menu=document.querySelector('#page-menu'); menu.hidden=!menu.hidden; event.currentTarget.setAttribute('aria-expanded',String(!menu.hidden)); }); document.addEventListener('click',()=>{ document.querySelector('#page-menu').hidden=true; document.querySelector('#page-menu-button').setAttribute('aria-expanded','false'); }); document.querySelector('#close-detail').addEventListener('click',()=>detail.close()); document.querySelector('#close-question-detail').addEventListener('click',()=>questionDetail.close()); questionBookmark.addEventListener('click',()=>{ const connection=currentQuestionConnection(); if(connection) toggleQuestionBookmark(connection); }); openQuestionViewer.addEventListener('click',()=>{ const connection=currentQuestionConnection(); if(connection) goQuestion(connection); });
    document.addEventListener('keydown',event=>{ if(questionDetail.open) { if(event.key==='Escape') { questionDetail.close(); return; } if(event.key==='ArrowUp'||event.key==='ArrowDown') { event.preventDefault(); moveQuestionConnection(event.key==='ArrowUp'?-1:1); return; } if(event.key==='ArrowLeft'||event.key==='ArrowRight') { event.preventDefault(); moveQuestionImage(event.key==='ArrowLeft'?-1:1); return; } } if(detail.open) { if(event.key==='Escape') { detail.close(); return; } if(event.key==='ArrowLeft'||event.key==='ArrowRight') { event.preventDefault(); openDetail((activeDetail+(event.key==='ArrowLeft'?-1:1)+inventory.length)%inventory.length); return; } } const isTyping=event.target?.matches('input, textarea, select, [contenteditable="true"]'); if(event.key.toLowerCase()==='r'&&!event.altKey&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!isTyping) { event.preventDefault(); reloadFolder(); } });
    const resizer=document.querySelector('#resizer'); resizer.addEventListener('pointerdown',event=>{ resizer.setPointerCapture(event.pointerId); const move=moveEvent=>{ const width=Math.min(window.innerWidth*.6,Math.max(260,moveEvent.clientX)); document.documentElement.style.setProperty('--nav-width',`${width}px`); localStorage.setItem(STORAGE.navWidth,String(width)); }; const up=()=>{ resizer.removeEventListener('pointermove',move); resizer.removeEventListener('pointerup',up); }; resizer.addEventListener('pointermove',move); resizer.addEventListener('pointerup',up); });
    setColumns(localStorage.getItem(STORAGE.columns),false); setImageSize(localStorage.getItem(STORAGE.imageSize),false); setQuestionImageSize(localStorage.getItem(STORAGE.questionImageSize),false); setInfo(localStorage.getItem(STORAGE.showInfo)!=='0',false); const savedWidth=Number(localStorage.getItem(STORAGE.navWidth)); if(savedWidth)document.documentElement.style.setProperty('--nav-width',`${savedWidth}px`);
    (async()=>{ if(new URLSearchParams(location.search).get('autoload')!=='1')return; try { const handle=await getHandle(); if(handle)await loadHandle(handle); } catch { status.textContent='최근 폴더를 다시 열지 못했습니다. 폴더 선택을 눌러 주세요.'; status.classList.add('error'); } })();
  </script>
