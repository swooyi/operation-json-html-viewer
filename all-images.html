<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그림 - 연산 JSON 뷰어</title>
  <style>
    :root { --line:#d8dde6; --panel:#f8fafc; --ink:#1f2933; --muted:#697586; --accent:#2563eb; --nav-width:32vw; --image-size:260px; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); font-family:"Malgun Gothic","Segoe UI",sans-serif; background:#fff; }
    header { min-height:52px; display:flex; align-items:center; gap:14px; padding:9px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .home-link { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border:1px solid var(--line); border-radius:4px; color:var(--ink); text-decoration:none; font-size:18px; } .home-link:hover { background:#f1f5f9; } .page-switcher { position:relative; } .page-switch-button { display:flex; align-items:center; gap:7px; border:0; padding:0; background:transparent; color:inherit; cursor:pointer; font:inherit; }
    h1 { margin:0; font-size:18px; } .caret { color:var(--muted); font-size:12px; } .page-menu { position:absolute; z-index:20; top:calc(100% + 8px); left:0; display:grid; gap:2px; min-width:145px; padding:6px; border:1px solid #dbe3ef; border-radius:6px; background:#fff; box-shadow:0 18px 40px rgba(15,23,42,.16); } .page-menu[hidden] { display:none; } .page-menu a { padding:8px 10px; color:var(--ink); text-decoration:none; border-radius:4px; font-size:13px; font-weight:700; } .page-menu a:hover,.page-menu a[aria-current="page"] { color:#1d4ed8; background:#eff6ff; }
    .button { border:1px solid var(--line); border-radius:5px; padding:7px 10px; background:#fff; color:var(--ink); cursor:pointer; font:inherit; font-size:13px; font-weight:700; } .button:hover { background:#f1f5f9; } .button.active { color:#fff; background:var(--accent); border-color:var(--accent); } .status { color:var(--muted); font-size:13px; } .status.error { color:#b42318; }
    main { height:calc(100vh - 53px); display:grid; grid-template-columns:minmax(260px,var(--nav-width)) 6px minmax(0,1fr); } nav { overflow:auto; background:var(--panel); border-right:1px solid var(--line); } .sidebar-head { position:sticky; top:0; z-index:1; padding:12px; border-bottom:1px solid var(--line); background:var(--panel); } #search { width:100%; margin-bottom:9px; padding:9px 11px; border:1px solid var(--line); border-radius:6px; font:inherit; } #file-list { padding:8px; } .file-button { display:block; width:100%; margin:3px 0; padding:9px 10px; border:1px solid transparent; border-radius:5px; background:transparent; text-align:left; color:var(--ink); cursor:pointer; font:inherit; font-size:13px; overflow-wrap:anywhere; } .file-button:hover { background:#eef2f7; } .file-button.active { color:#174ea6; border-color:#bfdbfe; background:#eaf2ff; font-weight:700; } .resizer { cursor:col-resize; background:var(--line); } .resizer:hover { background:#94a3b8; }
    article { overflow:auto; padding:20px; } .toolbar { position:sticky; top:-20px; z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 -20px 18px; padding:20px; border-bottom:1px solid var(--line); background:#fff; } .toolbar h2 { margin:0 auto 0 0; font-size:17px; } .group { display:flex; align-items:center; gap:5px; } .group label { color:var(--muted); font-size:13px; font-weight:700; } input[type="range"] { accent-color:var(--accent); } .image-count { color:var(--muted); font-size:13px; }
    #grid { display:grid; grid-template-columns:repeat(var(--columns,3),minmax(0,1fr)); gap:16px; align-items:start; } .image-card { min-width:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.04); } .image-button { display:flex; width:100%; min-height:150px; align-items:center; justify-content:center; padding:12px; border:0; background:#f8fafc; cursor:pointer; } .image-button:hover { background:#eef6ff; } .image-button img { display:block; width:min(100%,var(--image-size)); max-height:440px; object-fit:contain; } .missing { padding:20px; color:#b42318; text-align:center; font-size:13px; } .info { padding:11px 12px 12px; overflow-wrap:anywhere; } .file-name { font-weight:700; font-size:13px; } .connections { display:grid; gap:5px; margin-top:8px; } .connection { display:flex; align-items:flex-start; gap:6px; color:#475467; font-size:12px; line-height:1.45; } .question-link { flex:0 0 auto; border:1px solid var(--line); border-radius:4px; padding:2px 5px; background:#fff; color:#174ea6; cursor:pointer; font:inherit; font-size:11px; font-weight:700; } .info[hidden] { display:none; } .empty { max-width:520px; margin:80px auto; padding:24px; border:1px dashed var(--line); border-radius:8px; color:var(--muted); text-align:center; }
    dialog { width:min(94vw,900px); max-height:90vh; padding:0; border:1px solid var(--line); border-radius:10px; box-shadow:0 24px 60px rgba(15,23,42,.28); } dialog::backdrop { background:rgba(15,23,42,.42); } .dialog-head { display:flex; align-items:center; gap:10px; padding:12px 15px; border-bottom:1px solid var(--line); } .dialog-head strong { margin-right:auto; overflow-wrap:anywhere; } .dialog-body { display:grid; gap:14px; padding:16px; overflow:auto; } .dialog-body img { display:block; max-width:100%; max-height:55vh; margin:auto; object-fit:contain; } .note { white-space:pre-wrap; padding:10px; border-radius:6px; background:#eff6ff; font-size:13px; } .dialog-footer { display:flex; justify-content:space-between; gap:8px; padding:12px 15px; border-top:1px solid var(--line); }
    @media (max-width:860px) { header { gap:8px; padding:9px 12px; } main { height:auto; min-height:calc(100vh - 53px); grid-template-columns:1fr; } nav { max-height:34vh; border-right:0; border-bottom:1px solid var(--line); } .resizer { display:none; } article { min-height:60vh; padding:14px; } .toolbar { top:-14px; margin:0 -14px 18px; padding:14px; } #grid { grid-template-columns:repeat(min(var(--columns,2),2),minmax(0,1fr)); } }
    @media (max-width:500px) { #grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <a class="home-link" href="index.html" aria-label="홈으로 이동" title="홈으로 이동">⌂</a>
    <div class="page-switcher">
      <button id="page-menu-button" class="page-switch-button" type="button" aria-haspopup="true" aria-expanded="false"><h1>그림</h1><span class="caret">▼</span></button>
      <div id="page-menu" class="page-menu" hidden>
        <a href="question-viewer.html?autoload=1">문항 뷰</a>
        <a href="section-viewer.html?autoload=1">소단원 뷰</a>
        <a href="stats.html?autoload=1">통계</a>
        <a href="all-images.html?autoload=1" aria-current="page">그림</a>
      </div>
    </div>
    <button id="folder-button" class="button" type="button">폴더 선택</button>
    <input id="folder-input" type="file" accept=".json,application/json,image/png,image/jpeg,image/webp,image/gif,.png,.jpg,.jpeg,.webp,.gif" multiple webkitdirectory hidden>
    <button id="reload-button" class="button" type="button" disabled>다시 읽기</button>
    <span id="status" class="status">JSON 폴더를 선택해 주세요.</span>
    <span id="count" class="status"></span>
  </header>
  <main>
    <nav><div class="sidebar-head"><input id="search" type="search" placeholder="JSON 파일 찾기"><span id="file-count" class="status"></span></div><div id="file-list"></div></nav>
    <div id="resizer" class="resizer" role="separator" aria-label="좌측 패널 폭 조정"></div>
    <article>
      <div class="toolbar">
        <h2 id="title">그림</h2><span id="image-count" class="image-count"></span>
        <div class="group"><label>열</label><button class="button columns" data-columns="2" type="button">2</button><button class="button columns" data-columns="3" type="button">3</button><button class="button columns" data-columns="4" type="button">4</button></div>
        <div class="group"><label for="image-size">크기</label><input id="image-size" type="range" min="140" max="520" step="20"></div>
        <label class="group"><input id="show-info" type="checkbox"> <span>정보 보이기</span></label>
      </div>
      <div id="grid"></div><div id="empty" class="empty">왼쪽에서 JSON 파일을 선택해 주세요.</div>
    </article>
  </main>
  <dialog id="detail"><div class="dialog-head"><strong id="detail-name"></strong><button id="close-detail" class="button" type="button">닫기</button></div><div id="detail-body" class="dialog-body"></div><div class="dialog-footer"><span class="status">← → 이전/다음 그림 · Esc 닫기</span><span id="detail-position" class="status"></span></div></dialog>
  <script>
    const STORAGE = { navWidth:'allQuestionHtmlViewer.navWidth', columns:'allImages.columns', imageSize:'allImages.imageSize', showInfo:'allImages.showInfo', selectedFile:'allImages.selectedFile', contentScrollTop:'allImages.contentScrollTop' };
    const DB_NAME='all-question-html-viewer', DB_STORE='handles', FOLDER_HANDLE_KEY='recent-folder';
    const folderButton=document.querySelector('#folder-button'), folderInput=document.querySelector('#folder-input'), reloadButton=document.querySelector('#reload-button'), status=document.querySelector('#status'), count=document.querySelector('#count'), search=document.querySelector('#search'), fileList=document.querySelector('#file-list'), fileCount=document.querySelector('#file-count'), title=document.querySelector('#title'), imageCount=document.querySelector('#image-count'), grid=document.querySelector('#grid'), empty=document.querySelector('#empty'), imageSize=document.querySelector('#image-size'), showInfo=document.querySelector('#show-info'), detail=document.querySelector('#detail'), detailName=document.querySelector('#detail-name'), detailBody=document.querySelector('#detail-body'), detailPosition=document.querySelector('#detail-position');
    const content=document.querySelector('article');
    let filesByName=new Map(), imageIndex=new Map(), imageUrls=[], selectedFile='', inventory=[], activeDetail=-1, folderHandle=null;
    const collator=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});
    function imageKeys(value) { const raw=String(value||'').trim().replace(/^['"]|['"]$/g,'').replace(/\\/g,'/'); const base=raw.split('/').pop()||''; return [...new Set([raw,base].map(v=>v.normalize('NFC').toLowerCase()).filter(Boolean))]; }
    function isImage(file) { return /^image\/(png|jpe?g|webp|gif)$/i.test(file.type)||/\.(png|jpe?g|webp|gif)$/i.test(file.name); }
    function imageName(value) { const text=String(value||'').trim(); const tagged=/\[img\s*:\s*([^\]]+)\]/i.exec(text); return (tagged?tagged[1]:text).trim().replace(/^['"]|['"]$/g,'').split(/[\\/]/).pop(); }
    function values(value, result=[]) { if (typeof value==='string') { for (const match of value.matchAll(/\[img\s*:\s*([^\]]+)\]/gi)) { if (match[1].trim()) result.push(match[1].trim()); } } else if (Array.isArray(value)) value.forEach(item=>values(item,result)); else if (value&&typeof value==='object') Object.values(value).forEach(item=>values(item,result)); return result; }
    function imageValues(item, area) { const source=area==='문제' ? String(item.question?.stem||'') : String(item.explanation||''); const refs=values(source); const sequential=Array.isArray(item.images)?item.images.map(imageName).filter(Boolean):[]; let cursor=area==='해설' ? String(item.question?.stem||'').match(/\[img\]/gi)?.length||0 : 0; for (const match of source.matchAll(/\[img\]/gi)) { if (sequential[cursor]) refs.push(sequential[cursor]); cursor+=1; } return refs; }
    function noteFor(item, file) { return (Array.isArray(item.image_edit_notes)?item.image_edit_notes:[]).filter(note=>imageKeys(note?.image).some(key=>imageKeys(file).includes(key))).map(note=>String(note.note||'').trim()).filter(Boolean); }
    function sectionReference(section, sectionIndex) { const title=String(section?.section_title||''); const match=/^\s*(\d+)/.exec(title); return `section ${match?.[1]||sectionIndex+1}`; }
    function buildInventory(fileName, payload) { const map=new Map(); (payload.sections||[]).forEach((section,sectionIndex)=>{ (section?.items||[]).forEach(item=>{ ['문제','해설'].forEach(area=>{ imageValues(item,area).forEach(file=>{ const name=imageName(file); if (!name) return; const key=imageKeys(name)[0]; if (!map.has(key)) map.set(key,{fileName:name,connections:[],notes:[]}); const entry=map.get(key); const connection={ json:fileName, section:sectionReference(section,sectionIndex), qNumber:item.q_number??'-', area }; if(!entry.connections.some(item=>item.json===connection.json&&item.section===connection.section&&String(item.qNumber)===String(connection.qNumber)&&item.area===connection.area)) entry.connections.push(connection); entry.notes.push(...noteFor(item,name)); }); }); }); }); return [...map.values()].map(entry=>({ ...entry, notes:[...new Set(entry.notes)], url:imageKeys(entry.fileName).map(key=>imageIndex.get(key)).find(Boolean)||'' })).sort((a,b)=>collator.compare(a.fileName,b.fileName)); }
    function renderFiles() { const query=search.value.trim().toLowerCase(); const names=[...filesByName.keys()].filter(name=>name.toLowerCase().includes(query)).sort(collator.compare); fileList.replaceChildren(); fileCount.textContent=`${names.length}개 파일`; if (!names.length) { fileList.textContent='표시할 JSON 파일이 없습니다.'; return; } names.forEach(name=>{ const button=document.createElement('button'); button.type='button'; button.className=`file-button${name===selectedFile?' active':''}`; button.textContent=name; button.addEventListener('click',()=>selectFile(name)); fileList.appendChild(button); }); }
    function selectFile(name, restorePosition=false) { selectedFile=name; localStorage.setItem(STORAGE.selectedFile,name); inventory=buildInventory(name,filesByName.get(name)); activeDetail=-1; title.textContent=name; if(!restorePosition) { content.scrollTop=0; localStorage.setItem(STORAGE.contentScrollTop,'0'); } renderFiles(); renderInventory(); if(restorePosition) requestAnimationFrame(()=>{ content.scrollTop=Number(localStorage.getItem(STORAGE.contentScrollTop))||0; }); }
    function renderInventory() { grid.replaceChildren(); imageCount.textContent=selectedFile?`그림 ${inventory.length}개`:''; empty.hidden=Boolean(selectedFile&&inventory.length); if (!selectedFile) { empty.textContent='왼쪽에서 JSON 파일을 선택해 주세요.'; return; } if (!inventory.length) { empty.textContent='이 JSON 파일에 연결된 그림이 없습니다.'; return; } inventory.forEach((entry,index)=>{ const card=document.createElement('section'); card.className='image-card'; const button=document.createElement('button'); button.className='image-button'; button.type='button'; button.title='이미지 노트 보기'; button.addEventListener('click',()=>openDetail(index)); if (entry.url) { const img=document.createElement('img'); img.src=entry.url; img.alt=entry.fileName; img.addEventListener('error',()=>{ button.replaceChildren(); const missing=document.createElement('div'); missing.className='missing'; missing.textContent=`이미지를 불러오지 못했습니다: ${entry.fileName}`; button.appendChild(missing); }); button.appendChild(img); } else { const missing=document.createElement('div'); missing.className='missing'; missing.textContent=`이미지 파일 없음: ${entry.fileName}`; button.appendChild(missing); } card.appendChild(button); card.appendChild(makeInfo(entry)); grid.appendChild(card); }); }
    function makeInfo(entry) { const info=document.createElement('div'); info.className='info'; info.hidden=!showInfo.checked; const name=document.createElement('div'); name.className='file-name'; name.textContent=entry.fileName; info.appendChild(name); const connections=document.createElement('div'); connections.className='connections'; entry.connections.forEach(connection=>{ const row=document.createElement('div'); row.className='connection'; const text=document.createElement('span'); text.textContent=`${connection.section}_${connection.qNumber}번_${connection.area}`; const jump=document.createElement('button'); jump.className='question-link'; jump.type='button'; jump.textContent='문항 보기'; jump.addEventListener('click',()=>goQuestion(connection)); row.append(text,jump); connections.appendChild(row); }); info.appendChild(connections); return info; }
    function openDetail(index) { activeDetail=index; const entry=inventory[index]; if (!entry) return; detailName.textContent=entry.fileName; detailBody.replaceChildren(); if (entry.url) { const img=document.createElement('img'); img.src=entry.url; img.alt=entry.fileName; detailBody.appendChild(img); } else { const missing=document.createElement('div'); missing.className='missing'; missing.textContent=`이미지 파일 없음: ${entry.fileName}`; detailBody.appendChild(missing); } if (entry.notes.length) { const note=document.createElement('div'); note.className='note'; note.textContent=`이미지 노트\n${entry.notes.join('\n')}`; detailBody.appendChild(note); } const connections=makeInfo(entry); connections.hidden=false; detailBody.appendChild(connections); detailPosition.textContent=`${index+1} / ${inventory.length}`; if (!detail.open) detail.showModal(); }
    function goQuestion(connection) { const params=new URLSearchParams({autoload:'1',file:connection.json,q:String(connection.qNumber)}); window.location.href=`question-viewer.html?${params}`; }
    function setColumns(value, save=true) { const columns=[2,3,4].includes(Number(value))?Number(value):3; document.documentElement.style.setProperty('--columns',columns); document.querySelectorAll('.columns').forEach(button=>button.classList.toggle('active',Number(button.dataset.columns)===columns)); if(save)localStorage.setItem(STORAGE.columns,String(columns)); }
    function setImageSize(value, save=true) { const size=Math.min(520,Math.max(140,Number(value)||260)); imageSize.value=size; document.documentElement.style.setProperty('--image-size',`${size}px`); if(save)localStorage.setItem(STORAGE.imageSize,String(size)); }
    function setInfo(value, save=true) { showInfo.checked=Boolean(value); document.querySelectorAll('.info').forEach(info=>info.hidden=!showInfo.checked); if(save)localStorage.setItem(STORAGE.showInfo,showInfo.checked?'1':'0'); }
    function clearImages() { imageUrls.forEach(URL.revokeObjectURL); imageUrls=[]; imageIndex=new Map(); }
    function buildImageIndex(files) { clearImages(); files.filter(isImage).forEach(file=>{ const url=URL.createObjectURL(file); imageUrls.push(url); imageKeys(file.viewerRelativePath||file.webkitRelativePath||file.name).forEach(key=>{if(!imageIndex.has(key))imageIndex.set(key,url);}); }); }
    async function readHandle(handle,prefix='') { const result=[]; for await (const entry of handle.values()) { if(entry.kind==='file') { const file=await entry.getFile(); Object.defineProperty(file,'viewerRelativePath',{value:`${prefix}${entry.name}`,configurable:true}); result.push(file); } else if(entry.kind==='directory') result.push(...await readHandle(entry,`${prefix}${entry.name}/`)); } return result; }
    function openDb() { return new Promise((resolve,reject)=>{ const request=indexedDB.open(DB_NAME,1); request.onupgradeneeded=()=>request.result.createObjectStore(DB_STORE); request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error); }); }
    async function getHandle() { const db=await openDb(); return new Promise((resolve,reject)=>{ const request=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(FOLDER_HANDLE_KEY); request.onsuccess=()=>resolve(request.result||null); request.onerror=()=>reject(request.error); }); }
    async function saveHandle(handle) { const db=await openDb(); return new Promise((resolve,reject)=>{ const transaction=db.transaction(DB_STORE,'readwrite'); transaction.objectStore(DB_STORE).put(handle,FOLDER_HANDLE_KEY); transaction.oncomplete=resolve; transaction.onerror=()=>reject(transaction.error); }); }
    async function loadFiles(files, folderName='폴더') { buildImageIndex(files); filesByName=new Map(); for (const file of files.filter(file=>/\.json$/i.test(file.name)).sort((a,b)=>collator.compare(a.name,b.name))) { try { const payload=JSON.parse(await file.text()); if(Array.isArray(payload.sections)) filesByName.set(file.name,payload); } catch { /* Invalid JSON stays out of the picture inventory. */ } } const savedFile=localStorage.getItem(STORAGE.selectedFile); selectedFile=filesByName.has(savedFile)?savedFile:[...filesByName.keys()][0]||''; inventory=selectedFile?buildInventory(selectedFile,filesByName.get(selectedFile)):[]; count.textContent=`파일 ${filesByName.size}개 / 이미지 ${imageIndex.size}개`; status.textContent=`${folderName} 폴더를 읽었습니다.`; status.classList.remove('error'); reloadButton.disabled=!folderHandle; renderFiles(); renderInventory(); requestAnimationFrame(()=>{ content.scrollTop=Number(localStorage.getItem(STORAGE.contentScrollTop))||0; }); }
    async function loadHandle(handle) { const permission=await handle.requestPermission({mode:'read'}); if(permission!=='granted') throw new Error('폴더 읽기 권한이 필요합니다.'); folderHandle=handle; await loadFiles(await readHandle(handle),handle.name); }
    folderButton.addEventListener('click',async()=>{ try { if(window.showDirectoryPicker) { const handle=await window.showDirectoryPicker(); await saveHandle(handle); await loadHandle(handle); } else folderInput.click(); } catch(error) { if(error?.name!=='AbortError') { status.textContent=`폴더를 읽지 못했습니다: ${error.message}`; status.classList.add('error'); } } });
    folderInput.addEventListener('change',()=>{ folderHandle=null; loadFiles([...folderInput.files],folderInput.files[0]?.webkitRelativePath?.split('/')[0]||'폴더'); }); reloadButton.addEventListener('click',async()=>{ if(!folderHandle)return; try { await loadHandle(folderHandle); } catch(error) { status.textContent=`다시 읽지 못했습니다: ${error.message}`; status.classList.add('error'); } });
    document.querySelectorAll('.columns').forEach(button=>button.addEventListener('click',()=>setColumns(button.dataset.columns))); imageSize.addEventListener('input',()=>setImageSize(imageSize.value)); showInfo.addEventListener('change',()=>setInfo(showInfo.checked)); search.addEventListener('input',renderFiles); content.addEventListener('scroll',()=>localStorage.setItem(STORAGE.contentScrollTop,String(content.scrollTop)));
    document.querySelector('#page-menu-button').addEventListener('click',event=>{ event.stopPropagation(); const menu=document.querySelector('#page-menu'); menu.hidden=!menu.hidden; event.currentTarget.setAttribute('aria-expanded',String(!menu.hidden)); }); document.addEventListener('click',()=>{ document.querySelector('#page-menu').hidden=true; document.querySelector('#page-menu-button').setAttribute('aria-expanded','false'); }); document.querySelector('#close-detail').addEventListener('click',()=>detail.close());
    document.addEventListener('keydown',event=>{ if(detail.open) { if(event.key==='Escape') { detail.close(); return; } if(event.key==='ArrowLeft'||event.key==='ArrowRight') { event.preventDefault(); openDetail((activeDetail+(event.key==='ArrowLeft'?-1:1)+inventory.length)%inventory.length); } } });
    const resizer=document.querySelector('#resizer'); resizer.addEventListener('pointerdown',event=>{ resizer.setPointerCapture(event.pointerId); const move=moveEvent=>{ const width=Math.min(window.innerWidth*.6,Math.max(260,moveEvent.clientX)); document.documentElement.style.setProperty('--nav-width',`${width}px`); localStorage.setItem(STORAGE.navWidth,String(width)); }; const up=()=>{ resizer.removeEventListener('pointermove',move); resizer.removeEventListener('pointerup',up); }; resizer.addEventListener('pointermove',move); resizer.addEventListener('pointerup',up); });
    setColumns(localStorage.getItem(STORAGE.columns),false); setImageSize(localStorage.getItem(STORAGE.imageSize),false); setInfo(localStorage.getItem(STORAGE.showInfo)!=='0',false); const savedWidth=Number(localStorage.getItem(STORAGE.navWidth)); if(savedWidth)document.documentElement.style.setProperty('--nav-width',`${savedWidth}px`);
    (async()=>{ if(new URLSearchParams(location.search).get('autoload')!=='1')return; try { const handle=await getHandle(); if(handle)await loadHandle(handle); } catch { status.textContent='최근 폴더를 다시 열지 못했습니다. 폴더 선택을 눌러 주세요.'; status.classList.add('error'); } })();
  </script>
</body>
</html>
